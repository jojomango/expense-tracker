name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      # ── 架構警察：必須第一個跑，最快也最重要 ──
      - name: 架構純淨度檢查 (SPEC.md P1)
        run: npm run check:domain

      - name: Lint
        run: npm run lint

      - name: 型別檢查
        run: npm run typecheck

      - name: 單元測試 + domain 覆蓋率門檻 90%
        run: npm run test:cov

      - name: 安裝 Playwright 瀏覽器
        run: npx playwright install --with-deps chromium

      - name: E2E 測試
        run: npm run e2e

      - name: 上傳 Playwright 報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: 建置
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 建置（GitHub Pages base path）
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 部署到 GitHub Pages
    # 只有 main 分支才部署；PR 只驗證不部署
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
